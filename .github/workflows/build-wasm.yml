name: Build PHP 8.4 for Wasmer

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  build-wasi:
    name: Build PHP 8.4 WASI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config curl git

      - name: Download WASI SDK
        env:
          WASI_SDK_VERSION: 20.0
          WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz
        run: |
          curl -L $WASI_SDK_URL | tar -xz -C /opt
          sudo mv /opt/wasi-sdk-20.0 /opt/wasi-sdk

      - name: Download PHP 8.4 Source
        run: |
          # Fetch the latest PHP source code from the master branch (which will become PHP 8.4)
          git clone --depth=1 --branch master https://github.com/php/php-src.git php-src
          
      - name: Configure and Build PHP
        run: |
          cd php-src
          ./buildconf --force
          
          # Configure WASI target
          export CC="/opt/wasi-sdk/bin/clang"
          export CXX="/opt/wasi-sdk/bin/clang++"
          export LD="/opt/wasi-sdk/bin/wasm-ld"
          export AR="/opt/wasi-sdk/bin/llvm-ar"
          export RANLIB="/opt/wasi-sdk/bin/llvm-ranlib"
          
          ./configure \
            --host=wasm32-wasi \
            --disable-all \
            --disable-cgi \
            --disable-cli \
            --disable-fpm \
            --disable-phpdbg \
            --enable-embed \
            --without-iconv \
            --without-pcre-jit \
            --without-libxml \
            --without-sqlite3 \
            --without-pdo-sqlite \
            LIBS="-lc -lwasi-emulated-signal"
            
          make -j$(nproc)
          
          # Move the resulting binary
          cp libs/libphp.a ../php.wasm || cp sapi/embed/php.wasm ../php.wasm || echo "Check output location"
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-8.4-wasm
          path: php-src/php.wasm # Adjust with the correct output location

  publish-wasmer:
    name: Publish to Wasmer Registry
    needs: build-wasi
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Only publish on the main branch
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: php-8.4-wasm
          path: .

      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v2

      - name: Publish to Wasmer Registry
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          wasmer publish --non-interactive
