name: Build Modified PHP for Wasmer

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build & Publish PHP ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Menentukan versi spesifik (lengkap dan standar) yang juga 
        # merupakan nama branch di repositori Anda.
        version: ['8.4.21', '8.5.0-dev']

    steps:
      # 1. Mengambil kode PHP yang SUDAH DIMODIFIKASI MANUAL dari branch repositori ini
      - name: Checkout modified PHP source (Branch ${{ matrix.version }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.version }}

      # 2. Persiapan lingkungan build
      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf bison re2c pkg-config curl git

      # 3. Download WASI SDK
      - name: Download WASI SDK
        env:
          WASI_SDK_VERSION: 20.0
          WASI_SDK_URL: https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz
        run: |
          curl -L $WASI_SDK_URL | tar -xz -C /opt
          sudo mv /opt/wasi-sdk-20.0 /opt/wasi-sdk

      # 4. Konfigurasi & Build (Langsung build karena kode sudah dipatch manual oleh Anda)
      - name: Configure and Build PHP
        run: |
          ./buildconf --force
          
          export CC="/opt/wasi-sdk/bin/clang"
          export CXX="/opt/wasi-sdk/bin/clang++"
          export LD="/opt/wasi-sdk/bin/wasm-ld"
          export AR="/opt/wasi-sdk/bin/llvm-ar"
          export RANLIB="/opt/wasi-sdk/bin/llvm-ranlib"
          
          ./configure \
            --host=wasm32-wasi \
            --disable-all \
            --disable-cgi \
            --disable-fpm \
            --disable-phpdbg \
            --disable-fibers \
            --without-libxml \
            --without-iconv \
            --without-pcre-jit \
            --without-sqlite3 \
            --without-pdo-sqlite \
            LIBS="-lc -lwasi-emulated-signal"
            
          make -j$(nproc)
          
          # Memastikan file php WASM berada di root untuk dibaca oleh wasmer.toml
          cp sapi/cli/php ./php.wasm || cp sapi/embed/php.wasm ./php.wasm || cp libs/libphp.a ./php.wasm || echo "Check output location"

      # 5. Publikasi ke Wasmer
      # (wasmer.toml sudah harus berada di dalam branch masing-masing dengan versi yang sesuai)
      - name: Set up Wasmer
        uses: wasmerio/setup-wasmer@v2

      - name: Publish to Wasmer Registry
        env:
          WASMER_TOKEN: ${{ secrets.WASMER_TOKEN }}
        run: |
          wasmer publish --non-interactive
